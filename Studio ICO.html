<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio ICO - Conversor Profissional</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --bg: #0f172a;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Efeito de Vidro (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 { font-size: 28px; margin-bottom: 8px; font-weight: 800; letter-spacing: -0.5px; }
        p { color: #94a3b8; margin-bottom: 30px; font-size: 14px; }

        /* Área de Upload Customizada */
        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
            position: relative;
        }

        .drop-zone:hover, .drop-zone.active {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        #fileInput { display: none; }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-convert { background: var(--primary); color: white; grid-column: span 2; margin-bottom: 10px; }
        .btn-convert:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-convert:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; }

        .btn-clear { background: rgba(255, 255, 255, 0.1); color: #f8fafc; }
        .btn-clear:hover { background: rgba(255, 255, 255, 0.2); }

        .status-badge {
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            display: none;
            margin-top: 15px;
        }

        /* Animação suave */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .glass-card { animation: fadeIn 0.6s ease-out; }

    </style>
</head>
<body>

<div class="glass-card">
    <h1>Studio ICO</h1>
    <p>Converta imagens para ícones 256px de forma instantânea e privada para Windows.</p>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary); margin-bottom: 10px;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <div id="dropText">Clique ou arraste as imagens aqui</div>
        <input type="file" id="fileInput" accept="image/*" multiple>
    </div>

    <div class="btn-group">
        <button id="btnConvert" class="btn-convert" disabled>
            🚀 Converter Tudo
        </button>
        <button id="btnClear" class="btn-clear">
            🗑️ Limpar
        </button>
    </div>

    <div id="status" class="status-badge"></div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const btnConvert = document.getElementById('btnConvert');
    const btnClear = document.getElementById('btnClear');
    const status = document.getElementById('status');
    const dropText = document.getElementById('dropText');
    const dropZone = document.getElementById('dropZone');
    const SIZE = 256;

    // Atualiza interface ao selecionar arquivos
    fileInput.onchange = () => {
        const count = fileInput.files.length;
        if (count > 0) {
            btnConvert.disabled = false;
            dropText.innerHTML = `<b>${count} arquivo(s)</b> prontos para conversão`;
            status.style.display = "inline-block";
            status.innerText = "Pronto para processar";
        }
    };

    // Botão Limpar (Reseta tudo)
    btnClear.onclick = () => {
        fileInput.value = ""; // Limpa a seleção de arquivos
        btnConvert.disabled = true;
        dropText.innerHTML = "Clique ou arraste as imagens aqui";
        status.style.display = "none";
    };

    // Processo de conversão
    btnConvert.onclick = async () => {
        const files = fileInput.files;
        btnConvert.disabled = true;
        
        for (let i = 0; i < files.length; i++) {
            status.innerText = `Convertendo ${i + 1}/${files.length}...`;
            await convertAndDownload(files[i]);
        }
        
        status.innerText = "✨ Sucesso! Downloads concluídos.";
        btnConvert.disabled = false;
    };

    function convertAndDownload(file) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = SIZE; canvas.height = SIZE;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, SIZE, SIZE);
                ctx.drawImage(img, 0, 0, SIZE, SIZE);

                const imageData = ctx.getImageData(0, 0, SIZE, SIZE).data;
                const icoBuffer = createIco(imageData, SIZE, SIZE);
                const blob = new Blob([icoBuffer], {type: 'image/x-icon'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const originalName = file.name.split('.').slice(0, -1).join('.');
                a.download = `${originalName}.ico`;
                a.href = url;
                a.click();
                setTimeout(() => { URL.revokeObjectURL(url); resolve(); }, 150);
            };
        });
    }

    function createIco(rgbaData, width, height) {
        const headerSize = 6, dirSize = 16, bmpHeaderSize = 40;
        const pixelDataSize = width * height * 4;
        const buffer = new ArrayBuffer(headerSize + dirSize + bmpHeaderSize + pixelDataSize);
        const view = new DataView(buffer);
        view.setUint16(2, 1, true); view.setUint16(4, 1, true);
        view.setUint8(6, width === 256 ? 0 : width); 
        view.setUint8(7, height === 256 ? 0 : height);
        view.setUint16(12, 32, true);
        view.setUint32(14, bmpHeaderSize + pixelDataSize, true);
        view.setUint32(18, headerSize + dirSize, true);
        view.setUint32(22, 40, true);
        view.setInt32(26, width, true); view.setInt32(30, height * 2, true);
        view.setUint16(34, 1, true); view.setUint16(36, 32, true);
        let offset = headerSize + dirSize + bmpHeaderSize;
        for (let y = height - 1; y >= 0; y--) {
            for (let x = 0; x < width; x++) {
                const i = (y * width + x) * 4;
                view.setUint8(offset++, rgbaData[i + 2]);
                view.setUint8(offset++, rgbaData[i + 1]);
                view.setUint8(offset++, rgbaData[i]);
                view.setUint8(offset++, rgbaData[i + 3]);
            }
        }
        return buffer;
    }

    // Drag and Drop Effects
    ['dragenter', 'dragover'].forEach(name => {
        dropZone.addEventListener(name, e => {
            e.preventDefault();
            dropZone.classList.add('active');
        });
    });
    ['dragleave', 'drop'].forEach(name => {
        dropZone.addEventListener(name, e => {
            e.preventDefault();
            dropZone.classList.remove('active');
        });
    });
    dropZone.addEventListener('drop', e => {
        fileInput.files = e.dataTransfer.files;
        fileInput.onchange();
    });
</script>

</body>
</html>
